name: Daily Hot CB Scraper

on:
  schedule:
    # 櫃買當日行情檔約台灣時間 17:20 出，排三次，前一次寫成功後面就跳過
    # 台灣 18:00 / 20:00 / 22:30 -> UTC 10:00 / 12:00 / 14:30
    - cron: '0 10 * * 1-5'
    - cron: '0 12 * * 1-5'
    - cron: '30 14 * * 1-5' # 當天最後一次：還沒有今天的檔就算失敗
  workflow_dispatch: # 支援手動觸發

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Scraper & Sync to Cloud
        # 輸出同時存到 run.log，失敗時 Telegram 通知會附上錯誤行
        run: |
          set -o pipefail
          node tools/fetch-hot-cb.js --cloud ${{ github.event.schedule == '30 14 * * 1-5' && '--final' || '' }} 2>&1 | tee run.log
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID 未設定，略過通知"
            exit 0
          fi
          # 從主步驟的 log 取出錯誤行（❌/🛑/Error），沒有就取最後幾行
          if [ -s run.log ]; then
            REASON=$(grep -E '❌|🛑|Error|RESOURCE_EXHAUSTED' run.log | tail -n 5 | cut -c1-300)
            [ -z "$REASON" ] && REASON=$(tail -n 5 run.log | cut -c1-300)
          else
            REASON="主步驟之前就失敗了（例如安裝套件），請看 run 頁面。"
          fi
          HINT=""
          if grep -qE 'RESOURCE_EXHAUSTED|Quota exceeded' run.log 2>/dev/null; then
            HINT="
          → Firestore 每日免費額度用完（專案已停用計費），太平洋時間午夜重置。"
          fi
          TEXT="⚠️ me｜${WORKFLOW_NAME} 失敗
          ${REASON}${HINT}
          ${RUN_URL}"
          curl -sS --fail -o /dev/null -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}"
