name: Daily CB History Sync

on:
  schedule:
    # 台灣時間 14:15 (收盤行情更新後) -> UTC 06:15
    - cron: '15 6 * * 1-5'
  workflow_dispatch: # 支援手動觸發執行補漏

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute CB History Sync & Generate JSON
        run: node tools/fetch-cb-history.js --hot --watchlist --smart --sync
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
